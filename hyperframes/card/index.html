<!doctype html>
<html lang="th" data-composition-variables='[
  {"id":"name","type":"string","label":"File name","default":"01-meet"},
  {"id":"num","type":"string","label":"Stop number","default":"1"},
  {"id":"th","type":"string","label":"Thai title","default":"สอบบัณฑิตน้อย"},
  {"id":"en","type":"string","label":"English title","default":"The Prince Who Woke Up"},
  {"id":"color","type":"color","label":"Stop colour","default":"#e2a90f"},
  {"id":"pose","type":"string","label":"Character image","default":"assets/img/nen-jump.webp"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Itim"; src: url("assets/fonts/Itim-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Mali"; src: url("assets/fonts/Mali-SemiBold.ttf") format("truetype"); font-weight: 600; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #fff6e4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Mali", sans-serif; color: #2c1a0e; }
      #scene { position: absolute; inset: 0; }
      #fill { position: absolute; inset: 0; background: var(--color, #f28a1a); }
      #rays { position: absolute; left: 470px; top: 360px; width: 2200px; height: 2200px; margin: -1100px 0 0 -1100px; display: block; }
      #rays path { fill: #fffdf7; opacity: .16; }
      #dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(44, 26, 14, .14) 3px, transparent 3.5px); background-size: 34px 34px; }
      #panel { position: absolute; left: 90px; top: 150px; width: 760px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
      #badge { display: flex; align-items: center; gap: 16px; }
      #num-circle { display: grid; place-items: center; width: 132px; height: 132px; border-radius: 50%; background: #fffdf7; border: 7px solid #2c1a0e; box-shadow: 8px 8px 0 #2c1a0e; font-family: "Itim", sans-serif; font-size: 86px; line-height: 1; }
      #stop-label { display: block; font-family: "Itim", sans-serif; font-size: 40px; background: #f7c843; border: 5px solid #2c1a0e; border-radius: 999px; padding: 2px 26px; box-shadow: 6px 6px 0 #2c1a0e; }
      #title-plate { display: block; background: #fffdf7; border: 7px solid #2c1a0e; border-radius: 36px; box-shadow: 12px 12px 0 #2c1a0e; padding: 18px 40px 26px; }
      #th { display: block; font-family: "Itim", sans-serif; font-size: 96px; line-height: 1.2; color: var(--color, #f28a1a); -webkit-text-stroke: 3px #2c1a0e; paint-order: stroke fill; white-space: nowrap; }
      #en { display: block; font-size: 38px; color: #6b5442; }
      #pose { position: absolute; right: 0; bottom: -20px; width: 430px; height: 560px; object-fit: contain; object-position: bottom; display: block; }
      .confetti { position: absolute; left: 460px; top: 320px; width: 48px; height: 48px; display: block; }
      .confetti path { stroke: #2c1a0e; stroke-width: 2.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1280" data-height="720">
      <div id="scene" class="clip" data-start="0" data-duration="3.6" data-track-index="0">
        <div id="fill"></div>
        <svg id="rays" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
        <div id="dots"></div>
        <div id="confetti-layer"></div>
        <img id="pose" data-layout-allow-overflow data-var-src="pose" src="assets/img/nen-wave.webp" alt="" />
        <div id="panel">
          <div id="badge"><span id="num-circle" data-var-text="num">1</span><span id="stop-label">ด่านที่ · Stop</span></div>
          <div id="title-plate"><span id="th" data-var-text="th">พบเณรต้นบุญ</span><span id="en" data-var-text="en">Meet Tonboon</span></div>
        </div>
      </div>
    </div>
    <script>
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const NS = "http://www.w3.org/2000/svg";
      const rays = document.getElementById("rays");
      for (let i = 0; i < 20; i++) {
        const a = (i / 20) * Math.PI * 2, b = a + Math.PI / 20;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M0 0 L${Math.cos(a) * 100} ${Math.sin(a) * 100} L${Math.cos(b) * 100} ${Math.sin(b) * 100}Z`);
        rays.appendChild(p);
      }
      const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      const rnd = mulberry32(parseInt(vars.num || "1", 10) * 7919);
      const layer = document.getElementById("confetti-layer");
      const colors = ["#f27aa0", "#f7c843", "#fffdf7", "#7fc8ee", "#3f9a52"];
      const bits = [];
      for (let i = 0; i < 22; i++) {
        const s = document.createElementNS(NS, "svg");
        s.setAttribute("viewBox", "0 0 40 40"); s.setAttribute("class", "confetti");
        s.innerHTML = i % 2 ? `<path d="M20 4c7 8 7 20 0 32-7-12-7-24 0-32z" fill="${colors[i % 5]}"/>` : `<path d="M20 3l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="${colors[i % 5]}"/>`;
        layer.appendChild(s);
        const ang = rnd() * Math.PI * 2, dist = 320 + rnd() * 420;
        bits.push({ el: s, x: Math.cos(ang) * dist, y: Math.sin(ang) * dist * .7, r: (rnd() - .5) * 720, sc: .7 + rnd() * .8 });
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rays", { rotation: 0, scale: .6 }, { rotation: 50, scale: 1, duration: 3.6, ease: "power1.out" }, 0);
      tl.fromTo("#fill", { clipPath: "circle(0% at 37% 50%)" }, { clipPath: "circle(150% at 37% 50%)", duration: .55, ease: "power2.in" }, 0);
      tl.fromTo("#num-circle", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: .7, ease: "back.out(2)" }, .35);
      tl.fromTo("#stop-label", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: .45, ease: "back.out(2)" }, .6);
      tl.fromTo("#title-plate", { y: 120, rotation: -6, scale: .7, opacity: 0 }, { y: 0, rotation: 0, scale: 1, opacity: 1, duration: .65, ease: "back.out(1.8)" }, .7);
      tl.fromTo("#th", { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(3)", transformOrigin: "0% 50%" }, .9);
      tl.fromTo("#en", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: "power2.out" }, 1.15);
      tl.fromTo("#pose", { y: 560, rotation: 8 }, { y: 0, rotation: 0, duration: .75, ease: "back.out(1.5)", transformOrigin: "50% 100%" }, .8);
      tl.to("#pose", { y: -18, duration: .28, ease: "sine.out", yoyo: true, repeat: 3 }, 1.7);
      bits.forEach((b, i) => {
        tl.fromTo(b.el, { x: 0, y: 0, scale: 0, rotation: 0, opacity: 1 }, { x: b.x, y: b.y, scale: b.sc, rotation: b.r, duration: 1.1, ease: "power3.out" }, 1 + i * .01);
        tl.to(b.el, { y: b.y + 140, opacity: 0, duration: 1.2, ease: "power1.in" }, 2.1 + i * .01);
      });
      tl.to("#title-plate", { rotation: -1.5, duration: .4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
